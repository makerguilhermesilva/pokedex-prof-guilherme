<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Safari · Brasildex da Mata</title>
<style>
:root{
  --bg:#06120d;--panel:#0b1b13;--panel2:#10251a;--line:#2e5138;
  --text:#f4f1e8;--muted:#9eafa1;--green:#a8df43;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.page{width:min(1000px,94%);margin:auto;padding:20px 0 45px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.back{
  width:42px;height:42px;border:1px solid var(--line);border-radius:50%;
  display:grid;place-items:center;color:#fff;text-decoration:none;font-size:22px
}
.back:hover{border-color:var(--green)}
.title h1{font:700 25px Georgia,serif;margin:0}
.title p{
  margin:3px 0 0;color:#1ee39a;font-size:9px;font-weight:800;
  letter-spacing:2px
}
.biome-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.tab{
  border:1px solid #244330;border-radius:999px;background:#0b1b13;
  color:#aebbb0;padding:8px 12px;font-size:11px;cursor:pointer
}
.tab.active,.tab:hover{border-color:#477455;color:#e5f1e3}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#50d7b0}
.tab:nth-child(2) .dot{background:#d8c85d}.tab:nth-child(3) .dot{background:#65d678}
.tab:nth-child(4) .dot{background:#e7a14b}.tab:nth-child(5) .dot{background:#42c0d7}.tab:nth-child(6) .dot{background:#a4dc52}
.biome{margin-bottom:30px}
.biome.hidden{display:none}
.biome-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.biome-heading h2{font:700 18px Georgia,serif;margin:0}
.count{font-size:9px;color:#829287}
.scene{
  position:relative;height:360px;border:1px solid #284b34;border-radius:20px;
  overflow:hidden;background:#102218
}
.scene-bg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:saturate(.9) brightness(.78)
}
.scene:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(2,12,7,.08),rgba(2,10,6,.35) 65%,rgba(2,8,5,.78));
  pointer-events:none
}
.time-buttons{position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:5px}
.time{
  border:0;border-radius:999px;padding:8px 12px;background:#263831;color:#eaf0ea;
  font-size:10px;font-weight:700;cursor:pointer
}
.time.active{background:#67cfc1;color:#0a2b27}
.empty-scene{
  position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(270px,80%);text-align:center;padding:18px;border-radius:14px;
  background:rgba(14,29,20,.78);backdrop-filter:blur(8px);
  color:#dbe5dc;font-size:12px;line-height:1.45
}
.ground{position:absolute;left:0;right:0;bottom:0;height:30%;z-index:2}
.creature{
  position:absolute;z-index:3;bottom:18%;width:88px;height:88px;
  object-fit:contain;filter:drop-shadow(0 7px 5px rgba(0,0,0,.45));
  animation:walk 11s linear infinite
}
.creature.plant{bottom:10%;width:75px;height:95px;animation:sway 3s ease-in-out infinite}
.creature:nth-child(2){animation-delay:-4s}
.creature:nth-child(3){animation-delay:-7s}
@keyframes walk{
  0%{left:-12%;transform:scaleX(1)}
  48%{left:78%;transform:scaleX(1)}
  50%{left:82%;transform:scaleX(-1)}
  98%{left:-10%;transform:scaleX(-1)}
  100%{left:-12%;transform:scaleX(1)}
}
@keyframes sway{
  0%,100%{transform:rotate(-3deg) translateY(0)}
  50%{transform:rotate(3deg) translateY(-4px)}
}
.scene-label{
  position:absolute;left:15px;bottom:14px;z-index:5
}
.scene-label small{color:#21d8a0;font-size:9px;letter-spacing:1.5px;font-weight:800}
.scene-label h3{font:700 18px Georgia,serif;margin:5px 0 0}
.discovery-list{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px}
.badge{
  background:#0d2117;border:1px solid #2b4d35;border-radius:999px;
  padding:6px 9px;font-size:9px;color:#d5dfd6
}
.no-items{font-size:9px;color:#849287;margin-top:8px}
@media(max-width:650px){
  .scene{height:330px}
  .time-buttons{left:10px;right:auto}
  .time{padding:7px 9px}
  .creature{width:70px;height:70px}
}
</style>
</head>
<body>
<div class="page">
<header>
  <a class="back" href="index.html" aria-label="Voltar">←</a>
  <div class="title">
    <h1>Seu Safari</h1>
    <p>TUDO QUE VOCÊ JÁ DESCOBRIU. NO SEU BIOMA</p>
  </div>
</header>

<nav class="biome-tabs" id="tabs"></nav>
<main id="biomes"></main>
</div>

<script>
const BIOMES = [
  ["Amazônia","amazon"],
  ["Cerrado","cerrado"],
  ["Mata Atlântica","mata-atlantica"],
  ["Caatinga","caatinga"],
  ["Pantanal","pantanal"],
  ["Pampa","pampa"]
];

const backgrounds = {
  "Amazônia":"https://www.caf.com/media/2244064/la-riqueza-natural-de-la-amazonia-como-base-del-desarrollo-sostenible-regional.jpg?anchor=center&mode=crop&width=992&height=646&rnd=132131150920000000",
  "Cerrado":"https://ecoa.org.br/wp-content/uploads/2022/01/cerrado-vegetacao.jpg",
  "Mata Atlântica":"https://s2-umsoplaneta.glbimg.com/FrP5M1r-TJUdhWZ2i3-1rPGL7rI=/0x0:2128x1409/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_7d5b9b5029304d27b7ef8a7f28b4d70f/internal_photos/bs/2021/h/e/dyCcAXQxSnztyKwf4UZw/gettyimages-184401905.jpg",
  "Caatinga":"https://classic.exame.com/wp-content/uploads/2024/07/GettyImages-1069790592.jpg",
  "Pantanal":"https://t4.ftcdn.net/jpg/03/60/64/69/360_F_360646903_JwLTWXhMmhueyTSLzcbnE5XMRARyRm6b.jpg",
  "Pampa":"https://static.escolakids.uol.com.br/2025/07/1-vista-dos-pampas-bioma-brasileiro.jpg"
};

let discoveries = JSON.parse(localStorage.getItem("brasildexDiscoveries") || "[]");

function normalizeBiome(value){
  const n=String(value||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(n.includes("amazon")) return "Amazônia";
  if(n.includes("cerrado")) return "Cerrado";
  if(n.includes("mata atlant")) return "Mata Atlântica";
  if(n.includes("caating")) return "Caatinga";
  if(n.includes("pantanal")) return "Pantanal";
  if(n.includes("pampa")) return "Pampa";
  return null;
}

function getBiomes(item){
  return (item.biomas||[]).map(normalizeBiome).filter(Boolean);
}

function tabs(){
  const el=document.getElementById("tabs");
  const counts={};
  BIOMES.forEach(([name])=>counts[name]=0);
  discoveries.forEach(item=>getBiomes(item).forEach(b=>{if(counts[b]!==undefined)counts[b]++}));

  el.innerHTML=BIOMES.map(([name],i)=>`
    <button class="tab ${i===0?'active':''}" data-filter="${name}">
      <span class="dot"></span>${name} <strong>${counts[name]}</strong>
    </button>
  `).join("");

  el.querySelectorAll(".tab").forEach(button=>{
    button.addEventListener("click",()=>{
      el.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
      button.classList.add("active");
      const filter=button.dataset.filter;
      document.querySelectorAll(".biome").forEach(section=>{
        section.classList.toggle("hidden",section.dataset.biome!==filter);
      });
    });
  });
}

function render(){
  tabs();
  const container=document.getElementById("biomes");

  container.innerHTML=BIOMES.map(([biome])=>{
    const items=discoveries.filter(item=>getBiomes(item).includes(biome));
    const creatures=items.filter(item=>item.tipo!=="planta");
    const plants=items.filter(item=>item.tipo==="planta");

    let moving = items.slice(0,5).map(item=>`
      <img class="creature ${item.tipo==='planta'?'plant':''}"
           src="${escapeAttr(item.imagem)}"
           alt="${escapeAttr(item.nome_item||'Descoberta')}"
           title="${escapeAttr(item.nome_item||'Descoberta')}">
    `).join("");

    if(!moving){
      moving=`<div class="empty-scene">Ninguém por aqui ainda. Identifique algo de <b>${biome}</b> para ver a vida chegar nesse cenário.</div>`;
    }

    return `
      <section class="biome" data-biome="${biome}">
        <div class="biome-heading">
          <h2>${biome}</h2>
          <span class="count">${items.length} descoberta${items.length===1?'':'s'}</span>
        </div>
        <div class="scene">
          <img class="scene-bg" src="${backgrounds[biome]}" alt="Paisagem do bioma ${biome}">
          <div class="time-buttons">
            <button class="time active">Dia</button>
            <button class="time">Amanhecer</button>
            <button class="time">Crepúsculo</button>
            <button class="time">Noite</button>
          </div>
          ${items.length ? moving : moving}
          <div class="scene-label">
            <small>${biome.toUpperCase()} · DIA</small>
            <h3>${creatures.length} animal(is) · ${plants.length} planta(s)</h3>
          </div>
        </div>
        <div class="discovery-list">
          ${items.map(item=>`<span class="badge">${escapeHtml(item.nome_item||"Descoberta")}</span>`).join("")}
        </div>
        ${items.length===0?'<div class="no-items">Capture uma descoberta desse bioma para adicioná-la ao seu Safari.</div>':''}
      </section>
    `;
  }).join("");

  // Começa mostrando Amazônia, como na referência.
  document.querySelectorAll(".biome").forEach((section,i)=>section.classList.toggle("hidden",i!==0));

  document.querySelectorAll(".time").forEach(btn=>{
    btn.addEventListener("click",()=>{
      btn.parentElement.querySelectorAll(".time").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      // A paisagem continua sendo a mesma nesta primeira versão.
      // O botão fica preparado para trocar iluminação/ambiente futuramente.
    });
  });
}

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(value){return escapeHtml(value)}

render();
</script>
</body>
</html>
